<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#14263b">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="오답기록">
  <meta name="description" content="원문 이미지를 그대로 보존하는 개인용 오답 기록 및 반복 복습 앱">
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="apple-touch-icon" href="./icon-192.png">
  <link rel="icon" href="./icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="./styles.css">
  <title>오답기록 — CPA Study</title>
</head>
<body>
  <header class="appbar">
    <div class="appbar-inner">
      <div class="brand"><span class="brandmark">✓</span><span>오답기록<small>CPA STUDY</small></span></div>
      <div class="head-actions"><span id="storage-state" class="online-state" title="브라우저 내부에 저장">기기 내부 저장</span><button id="top-add" class="btn btn-accent btn-compact">+ 오답 등록</button></div>
    </div>
  </header>
  <div class="layout">
    <aside class="sidebar" aria-label="주 메뉴">
      <div class="navlist">
        <button data-tab="dashboard" class="nav active"><span>▦</span> 대시보드</button>
        <button data-tab="add" class="nav"><span>＋</span> 오답 등록</button>
        <button data-tab="review" class="nav"><span>↻</span> 오늘 복습</button>
        <button data-tab="library" class="nav"><span>▤</span> 전체 오답</button>
        <button data-tab="backup" class="nav"><span>⇩</span> 백업 및 복원</button>
      </div>
      <div class="sidebar-note">원문은 수정하지 않고 보존합니다.<br>데이터는 이 브라우저 또는 설치된 웹앱에 저장됩니다.</div>
    </aside>
    <main id="content" tabindex="-1" aria-live="polite"></main>
  </div>
  <nav class="bottom-nav" aria-label="하단 메뉴">
    <button data-tab="dashboard" class="active"><span>▦</span>홈</button>
    <button data-tab="add"><span>＋</span>등록</button>
    <button data-tab="review"><span>↻</span>복습</button>
    <button data-tab="library"><span>▤</span>전체</button>
    <button data-tab="backup"><span>⇩</span>백업</button>
  </nav>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <script type="module" src="./app.js"></script>
</body>
</html>
